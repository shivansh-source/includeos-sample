name: CI

on:
  pull_request:
  push:
    branches: [ main ]

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Install dependencies (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qemu-system-x86
      
      - uses: actions/checkout@v4
      
      - name: Build IncludeOS application
        run: |
          mkdir -p build
          cd build
          cmake ..
          make
      
      - name: Verify binary exists
        run: |
          ls -lh build/includeos-sample
          file build/includeos-sample
      
      - name: Run with QEMU
        run: |
          # This would test with actual QEMU if you have bootloader
          ./build/includeos-sample

  docker-build-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t includeos-sample:latest .
      
      - name: Test Docker image
        run: docker run --rm includeos-sample:latest
      
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag includeos-sample:latest ${{ secrets.DOCKER_USERNAME }}/includeos-sample:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/includeos-sample:latest